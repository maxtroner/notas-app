name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create release and upload installer
        run: |
          gh release create ${{ github.ref_name }} dist/*.exe dist/*.yml --generate-notes --clobber || gh release upload ${{ github.ref_name }} dist/*.exe dist/*.yml --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
