<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#00c853">
    <title>CodeNote</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="styles.css?v=3">
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Navegacion principal">
        <div class="brand-row">
          <div class="brand-mark" aria-hidden="true">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
          </div>
          <div>
            <strong>CodeNote</strong>
            <span>Notas inteligentes</span>
          </div>
        </div>

        <div class="sidebar-search">
          <span aria-hidden="true">⌕</span>
          <input id="searchInput" type="search" placeholder="Buscar notas...">
        </div>

        <button class="primary-action" id="newNoteButton" type="button">
          <span aria-hidden="true">+</span>
          Nueva nota
        </button>

        <nav class="nav-groups" aria-label="Vistas">
          <button class="nav-item active" type="button" data-view="all">
            <span aria-hidden="true">▣</span>
            Notas
            <em id="allCount">0</em>
          </button>
          <button class="nav-item" type="button" data-view="favorites">
            <span aria-hidden="true">☆</span>
            Accesos directos
            <em id="favoriteCount">0</em>
          </button>
          <button class="nav-item muted-nav" type="button" data-view="tasks">
            <span aria-hidden="true">☑</span>
            Tareas
            <em>0</em>
          </button>
        </nav>

        <section class="sidebar-section">
          <div class="section-title">
            <span>Libretas</span>
            <button class="side-add" id="addNotebookButton" type="button" title="Crear libreta">+</button>
          </div>
          <div class="notebook-list" id="notebookList"></div>
        </section>

        <section class="sidebar-section tags-section">
          <div class="section-title">
            <span>Etiquetas</span>
            <span class="side-add" aria-hidden="true">+</span>
          </div>
          <div class="tag-cloud" id="tagCloud"></div>
        </section>

        <nav class="nav-groups bottom-nav" aria-label="Papelera">
          <button class="nav-item" type="button" data-view="trash">
            <span aria-hidden="true">♲</span>
            Papelera
            <em id="trashCount">0</em>
          </button>
        </nav>

        <div class="sidebar-footer">
          <button class="ghost-action" id="exportButton" type="button">Exportar</button>
          <label class="ghost-action file-picker">
            Importar
            <input id="importInput" type="file" accept="application/json">
          </label>
          <button class="theme-toggle" id="themeToggle" type="button" title="Modo oscuro">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
          </button>
        </div>
      </aside>

      <main class="workspace">
        <section class="note-list-panel" aria-label="Lista de notas">
          <div class="list-meta">
            <div>
              <strong id="viewTitle">Notas</strong>
              <span id="noteCountLabel">0 notas</span>
            </div>
            <button class="sort-button" id="sortButton" type="button" title="Ordenar">Mas recientes⌄</button>
          </div>
          <div class="note-list" id="noteList"></div>
        </section>

        <section class="editor-panel" aria-label="Editor de nota">
          <div id="updateBanner" class="update-banner" hidden>
            <span id="updateBannerText">Actualizacion disponible</span>
            <button id="updateInstallBtn" type="button" class="update-install-btn">Instalar ahora</button>
            <button id="updateDismissBtn" type="button" class="update-dismiss-btn">&times;</button>
          </div>
          <div class="empty-state" id="emptyState">
            <h1>Elige una nota o crea una nueva</h1>
            <p>Tu contenido se guarda automaticamente en este equipo.</p>
          </div>

          <article class="editor" id="editor">
            <header class="editor-header">
              <div class="editor-meta">
                <span class="book-icon" aria-hidden="true">▣</span>
                <select id="notebookSelect" aria-label="Libreta"></select>
                <span class="status-line" id="statusLine">Autoguardado activado</span>
              </div>
              <div class="editor-actions">
                <button class="tool-button" type="button" id="favoriteButton" title="Favorita">☆</button>
                <button class="tool-button danger" type="button" id="deleteButton" title="Eliminar"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg></button>
              </div>
            </header>

            <div class="tag-editor">
              <span aria-hidden="true">◇</span>
              <input id="tagInput" type="text" placeholder="+ Etiqueta">
            </div>

            <div class="format-toolbar" aria-label="Formato">
              <button class="tool-button" type="button" data-command="bold" title="Negrita"><strong>B</strong></button>
              <button class="tool-button" type="button" data-command="italic" title="Cursiva"><em>I</em></button>
              <button class="tool-button" type="button" data-command="underline" title="Subrayado"><u>U</u></button>
              <button class="tool-button accent-tool" type="button" data-command="foreColor" data-value="#00a82d" title="Color">A</button>
              <button class="tool-button" type="button" data-command="formatBlock" data-value="blockquote" title="Cita">⌁</button>
              <span class="tool-separator"></span>
              <button class="tool-button" type="button" data-command="insertUnorderedList" title="Lista">≡</button>
              <button class="tool-button" type="button" data-command="insertOrderedList" title="Lista numerada">1.</button>
              <button class="tool-button" type="button" data-command="insertHTML" data-value="<p>☐ </p>" title="Checklist">☑</button>
              <span class="tool-separator"></span>
              <button class="tool-button" type="button" data-command="formatBlock" data-value="pre" title="Codigo">&lt;&gt;</button>
            </div>

            <input id="titleInput" class="title-input" type="text" placeholder="Titulo de la nota">
            <div id="contentInput" class="content-input" contenteditable="true" data-placeholder="Empieza a escribir..."></div>
          </article>
        </section>
      </main>
    </div>

    <div id="contextMenu" class="context-menu" hidden>
      <button id="contextDeleteBtn" type="button">Eliminar</button>
    </div>

    <script src="app.js?v=2"></script>
  </body>
</html>
